<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvestTrack — накопления и инвестиции</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f0;--card:#fff;--ink:#15221e;--mut:#667570;--line:#dfe5df;--ac:#0f766e;--acs:#d6ede9;--neg:#b4443a;--pos:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a17;--card:#17241f;--ink:#e8efeb;--mut:#8fa29b;--line:#26362f;--ac:#3fb8a8;--acs:#1c3a35;--neg:#e0776c;--pos:#3fb8a8}}
:root[data-theme=dark]{--bg:#101a17;--card:#17241f;--ink:#e8efeb;--mut:#8fa29b;--line:#26362f;--ac:#3fb8a8;--acs:#1c3a35;--neg:#e0776c;--pos:#3fb8a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
.app{max-width:760px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top b{font-size:18px;font-weight:800}.top span{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:600 13px inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{padding:22px 18px}
.big{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.mid{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
.mut{color:var(--mut);font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:10px;background:var(--acs);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:10px 16px;font:700 14px inherit;cursor:pointer}
.btn.g{background:var(--acs);color:var(--ac)}.btn.d{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn.sm{padding:5px 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:4px 11px;font:600 12px inherit;cursor:pointer}
.chips button.on{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.who{margin:0 0 12px}
.who button{padding:6px 13px;font-size:13px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.fab .btn{box-shadow:0 6px 18px #0004;padding:13px 20px;font-size:15px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.on{display:flex}
#modal form{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px;max-height:92%;overflow:auto}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.acts{display:flex;gap:8px;margin-top:16px}
.note{background:var(--acs);color:var(--ink);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;overflow-x:auto}
.bars div{flex:1;min-width:34px;text-align:center;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.bars i.o{background:var(--neg);opacity:.8}
svg{width:100%;height:auto;display:block}
.tag{font-size:11px;background:var(--acs);color:var(--ac);padding:2px 8px;border-radius:10px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:24px 0}
textarea{min-height:110px;font:12px monospace}
</style></head>
<body>
<div class="app" id="app"></div>
<div class="fab" id="fab"></div>
<div id="modal"></div>
<script>
const R={KZT:1,USD:480,EUR:520,RUB:5.5,JPY:3.2},SYM={KZT:'₸',USD:'$',EUR:'€',RUB:'₽',JPY:'¥'};
const ROLE={owner:'👑 Владелец',member:'👤 Участник',viewer:'👀 Наблюдатель'};
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ym=d=>d.slice(0,7);
const nm=m=>{let[y,x]=m.split('-').map(Number);x++;if(x>12){x=1;y++}return y+'-'+String(x).padStart(2,'0')};
const pm=m=>{let[y,x]=m.split('-').map(Number);x--;if(x<1){x=12;y--}return y+'-'+String(x).padStart(2,'0')};
function seed(){const p=[{id:'p1',name:'Даниял',role:'owner'},{id:'p2',name:'Али',role:'member'},{id:'p3',name:'Тимур',role:'member'}];
const o=(t,type,sub,amount,date,comment,p,init)=>({id:uid(),t,type,sub,amount,cur:'KZT',date,comment,p,init});
return{name:'Мой портфель',user:'Даниял',cur:'KZT',start:'2025-09-01',goal:2000000,theme:'auto',notif:true,pin:'',me:'p1',
invVals:{p1:130000,p2:195000,p3:325000},rate:10,accr:true,lastAcc:null,people:p,
ops:[o('bank','in','Kaspi',100000,'2025-09-01','Начальная сумма','p1',1),o('bank','in','Kaspi',400000,'2025-10-15','Пополнение','p1'),o('bank','in','Halyk',350000,'2025-12-10','Пополнение','p2'),o('bank','out','Kaspi',50000,'2026-02-03','Покупка','p1'),
o('inv','in','Apple',100000,'2026-01-10','Акции','p1'),o('inv','in','S&P 500 ETF',250000,'2026-03-02','ETF','p3'),o('inv','in','Другие',150000,'2026-05-20','Облигации','p2'),o('bank','in','Kaspi',50000,'2026-09-30','Пополнение','p1')],
goals:[{id:uid(),e:'🏎️',name:'Новая машина',target:10000000,cur:3500000},{id:uid(),e:'💰',name:'Финансовая подушка',target:1000000,cur:400000}]}}
let S;try{S=JSON.parse(localStorage.getItem('it2'))}catch(e){}
S=S||seed();
const save=()=>{try{localStorage.setItem('it2',JSON.stringify(S))}catch(e){}};
let tab='home',range=0,hf='all',who='all',locked=!!S.pin;
const sgn=o=>o.type==='out'?-1:1;
const base=o=>sgn(o)*o.amount*R[o.cur||'KZT']/R[S.cur];
const money=(n,c=S.cur)=>Math.round(n).toLocaleString('ru-RU')+' '+SYM[c];
const fd=d=>new Date(d+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const sg=n=>(n>0?'+':n<0?'−':'')+money(Math.abs(n));
const me=()=>S.people.find(p=>p.id===S.me)||{role:'viewer'};
const canAdd=()=>me().role!=='viewer',owner=()=>me().role==='owner';
const canEdit=o=>owner()||(me().role==='member'&&o.p===me().id);
const canVal=id=>owner()||(me().role==='member'&&me().id===id);
const pname=id=>(S.people.find(p=>p.id===id)||{name:'—'}).name;
// Кого смотрим: 'all' — всех вместе, иначе — одного человека отдельно
const vis=o=>who==='all'||o.p===who;
const sumAll=f=>S.ops.filter(f).reduce((a,o)=>a+base(o),0);
const sum=f=>sumAll(o=>vis(o)&&f(o));
// Инвестиции каждого человека — отдельный портфель
const pInv=id=>sumAll(o=>o.t==='inv'&&o.p===id);
const pVal=id=>S.invVals[id]==null?pInv(id):+S.invVals[id];
const pCap=id=>sumAll(o=>o.t==='bank'&&o.p===id)+pVal(id);
const monthly=()=>(who==='all'?S.people.reduce((a,p)=>a+pVal(p.id),0):pVal(who))*S.rate/100;
const stats=()=>{const bank=sum(o=>o.t==='bank'),inv=sum(o=>o.t==='inv');
 const iv=who==='all'?inv+S.people.reduce((a,p)=>a+pVal(p.id)-pInv(p.id),0):pVal(who);
 return{bank,inv,iv,gain:iv-inv,cap:bank+iv}};

function migrate(){
 if(!S.invVals){S.invVals={};if(S.invVal!=null){const t=S.people.reduce((a,p)=>a+pInv(p.id),0);
  S.people.forEach(p=>{const v=pInv(p.id);if(v>0&&t)S.invVals[p.id]=S.invVal*v/t})}delete S.invVal}
 if(S.rate==null)S.rate=10;if(S.accr==null)S.accr=true;if(S.lastAcc===undefined)S.lastAcc=null;
 if(who!=='all'&&!S.people.some(p=>p.id===who))who='all';
}
// Каждый месяц 1-го числа: rate% от стоимости инвестиций человека зачисляется на его банк
function accrue(){
 if(!S.accr||!(S.rate>0))return;
 const cur=ym(today());
 if(!S.lastAcc)S.lastAcc=pm(cur);
 while(S.lastAcc<cur){const m=nm(S.lastAcc),d=m+'-01';
  S.people.forEach(p=>{const all=pInv(p.id),at=sumAll(o=>o.t==='inv'&&o.p===p.id&&o.date<=d);
   if(all>0&&at>0){const a=Math.round(pVal(p.id)*Math.min(1,at/all)*S.rate/100);
    if(a>0)S.ops.push({id:uid(),t:'bank',type:'in',sub:'Доход с инвестиций',amount:a,cur:S.cur,date:d,comment:S.rate+'% с инвестиций',p:p.id,auto:1})}});
  S.lastAcc=m}
 save();
}

function form(title,fields,onSave,onDel){
 const m=document.getElementById('modal');
 m.innerHTML=`<form><h3>${title}</h3>${fields.map(f=>`<label>${f.l}</label>`+(f.o?`<select name="${f.k}">${f.o.map(x=>`<option value="${esc(x[0])}" ${x[0]==f.v?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.t==='number'?'step="any"':''} ${f.opt?'':'required'}>`)).join('')}
 <div class="acts"><button class="btn">Сохранить</button><button type="button" class="btn g" data-a="close">Отмена</button>${onDel?'<button type="button" class="btn d" id="del">Удалить</button>':''}</div></form>`;
 m.classList.add('on');
 const f=m.querySelector('form');
 f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));m.classList.remove('on');onSave(d);save();render()};
 if(onDel)f.querySelector('#del').onclick=()=>{m.classList.remove('on');onDel();save();render()};
}
const A={
 close(){document.getElementById('modal').classList.remove('on')},
 tab(d){tab=d.v;render();scrollTo(0,0)},
 who(d){who=d.v;render()},
 range(d){range=+d.v;render()},
 hf(d){hf=d.v;render()},
 add(d){opForm(null,d.type||'in',d.t||'bank')},
 edit(d){opForm(S.ops.find(o=>o.id===d.id))},
 invval(d){const id=d.id||who;if(!id||id==='all')return;if(!canVal(id))return alert('Можно обновлять только стоимость своих инвестиций');
  form('Текущая стоимость инвестиций — '+esc(pname(id)),[{k:'v',l:'Сумма, '+S.cur,t:'number',v:Math.round(pVal(id))}],x=>{S.invVals[id]=+x.v})},
 person(d){personForm(S.people.find(p=>p.id===d.id))},
 goal(d){goalForm(S.goals.find(g=>g.id===d.id))},
 renbank(d){form('Название банка',[{k:'n',l:'Название',v:d.v}],x=>{S.ops.forEach(o=>{if(o.t==='bank'&&o.sub===d.v)o.sub=x.n})})},
 settings(){settingsForm()},
 reset(){if(confirm('Вернуть демо-данные и стереть всё остальное?')){S=seed();locked=false;who='all';accrue()}render();save()},
 backup(){const m=document.getElementById('modal');m.innerHTML=`<form><h3>Резервная копия</h3><label>Скопируйте текст, чтобы сохранить. Вставьте сюда ранее сохранённую копию и нажмите «Восстановить».</label><textarea id="bk">${esc(JSON.stringify(S))}</textarea><div class="acts"><button type="button" class="btn" id="rs">Восстановить</button><button type="button" class="btn g" data-a="close">Закрыть</button></div></form>`;m.classList.add('on');
  m.querySelector('#rs').onclick=()=>{try{const x=JSON.parse(m.querySelector('#bk').value);if(!x.ops||!x.people)throw 0;S=x;migrate();accrue();save();m.classList.remove('on');render()}catch(e){alert('Не удалось прочитать копию')}}},
 delacc(){if(confirm('Удалить все данные? Это нельзя отменить.')){S={...seed(),ops:[],goals:[],invVals:{},lastAcc:null,people:[{id:'p1',name:S.user,role:'owner'}],me:'p1',pin:''};who='all';save();tab='home';render()}}
};
function opForm(o,type='in',t='bank'){
 if(!canAdd())return alert('У наблюдателя нет прав на изменение');
 if(o&&!canEdit(o))return alert('Вы можете менять только свои операции');
 const v=o||{type,t,sub:t==='bank'?'Kaspi':'Акции',amount:'',cur:S.cur,date:today(),comment:'',p:who!=='all'?who:me().id};
 const mine=owner()?S.people:S.people.filter(p=>p.id===me().id);
 form(o?'Изменить операцию':v.type==='in'?'Добавить деньги':'Снять деньги',[
  {k:'type',l:'Действие',o:[['in','Пополнение'],['out','Снятие']],v:v.type},
  {k:'t',l:'Куда',o:[['bank','🏦 Банк'],['inv','📈 Инвестиции']],v:v.t},
  {k:'sub',l:'Банк / актив',v:v.sub},
  {k:'amount',l:'Сумма',t:'number',v:v.amount},
  {k:'cur',l:'Валюта',o:Object.keys(R).map(c=>[c,c+' '+SYM[c]]),v:v.cur},
  {k:'date',l:'Дата',t:'date',v:v.date},
  {k:'comment',l:'Комментарий / причина',v:v.comment,opt:1},
  {k:'p',l:'Чьи деньги',o:mine.map(p=>[p.id,p.name]),v:v.p}],
  d=>{d.amount=Math.abs(+d.amount);if(o)Object.assign(o,d);else S.ops.push({id:uid(),...d})},
  o?()=>{S.ops=S.ops.filter(x=>x!==o)}:null);
}
function personForm(p){
 if(!owner())return alert('Только владелец управляет участниками');
 const n=!p;
 form(n?'Новый участник':'Участник',[{k:'name',l:'Имя',v:p?p.name:''},{k:'role',l:'Роль',o:Object.entries(ROLE),v:p?p.role:'member'}].concat(n?[{k:'amt',l:'Начальная сумма',t:'number',v:0},{k:'date',l:'Дата начала',t:'date',v:today()}]:[]),
 d=>{if(n){const id=uid();S.people.push({id,name:d.name,role:d.role});if(+d.amt>0)S.ops.push({id:uid(),t:'bank',type:'in',sub:'Kaspi',amount:+d.amt,cur:S.cur,date:d.date,comment:'Начальная сумма',p:id,init:1})}else{p.name=d.name;p.role=d.role}},
 !n&&p.role!=='owner'?()=>{S.people=S.people.filter(x=>x!==p);delete S.invVals[p.id];if(who===p.id)who='all'}:null);
}
function goalForm(g){
 const n=!g;
 form(n?'Новая цель':'Цель',[{k:'e',l:'Значок',v:g?g.e:'🎯'},{k:'name',l:'Название',v:g?g.name:''},{k:'target',l:'Цель, '+S.cur,t:'number',v:g?g.target:''},{k:'cur',l:'Накоплено сейчас',t:'number',v:g?g.cur:0}],
 d=>{d.target=+d.target;d.cur=+d.cur;n?S.goals.push({id:uid(),...d}):Object.assign(g,d)},g?()=>{S.goals=S.goals.filter(x=>x!==g)}:null);
}
function settingsForm(){
 form('Настройки',[{k:'user',l:'Имя пользователя',v:S.user},{k:'name',l:'Название портфеля',v:S.name},{k:'cur',l:'Валюта отображения',o:Object.keys(R).map(c=>[c,c+' '+SYM[c]]),v:S.cur},{k:'start',l:'Дата начала инвестирования',t:'date',v:S.start},{k:'goal',l:'Цель портфеля',t:'number',v:S.goal},
 {k:'accr',l:'Ежемесячный доход с инвестиций на банк',o:[['1','Включён'],['0','Выключен']],v:S.accr?'1':'0'},{k:'rate',l:'Процент в месяц, %',t:'number',v:S.rate},
 {k:'theme',l:'Тема',o:[['auto','Авто'],['light','Светлая'],['dark','Тёмная']],v:S.theme},{k:'notif',l:'Уведомления',o:[['1','Включены'],['0','Выключены']],v:S.notif?'1':'0'},
 {k:'me',l:'Работать как (проверка прав)',o:S.people.map(p=>[p.id,p.name+' — '+ROLE[p.role]]),v:S.me},{k:'pin',l:'PIN-код (пусто — без PIN)',v:S.pin,t:'password',opt:1}],
 d=>{const old=S.cur;if(old!==d.cur)for(const k in S.invVals)S.invVals[k]=S.invVals[k]*R[old]/R[d.cur];
  const wasOn=S.accr;Object.assign(S,d,{goal:+d.goal,notif:d.notif==='1',accr:d.accr==='1',rate:Math.max(0,+d.rate||0)});
  if(S.accr&&!wasOn)S.lastAcc=ym(today());accrue()});
}
const V={
home(){const s=stats(),pr=Math.min(100,Math.max(0,s.cap/S.goal*100));
 const nt=[];if(S.notif){const l=S.ops.filter(vis).map(o=>o.date).sort().pop();if(l&&(Date.now()-new Date(l))/864e5>7)nt.push('🔔 Вы не добавляли операции уже больше 7 дней');
 if(who==='all'){if(S.goal>s.cap)nt.push('🎯 До цели осталось '+money(S.goal-s.cap));else nt.push('🎉 Цель портфеля достигнута')}
 if(s.gain>0&&s.inv>0)nt.push('📈 Инвестиции выросли на '+(s.gain/s.inv*100).toFixed(1).replace('.',',')+'%')}
 if(S.accr&&S.rate>0&&S.lastAcc&&monthly()>0)nt.push(`💸 ${S.rate}% с инвестиций приходит на банк 1-го числа. Следующее начисление ${fd(nm(S.lastAcc)+'-01')}: ~${money(monthly())}`);
 return nt.map(x=>`<div class="note">${x}</div>`).join('')+`<div class="card hero"><div class="mut">${who==='all'?esc(S.name)+' · общий капитал':'👤 '+esc(pname(who))+' · личный капитал'}</div><div class="big">${money(s.cap)}</div>
 <div class="grid" style="margin-top:16px"><div><div class="mut">🏦 В банке</div><b>${money(s.bank)}</b></div><div><div class="mut">📈 В инвестициях</div><b>${money(s.iv)}</b></div>
 <div><div class="mut">📊 Доход / изменение</div><b class="${s.gain<0?'neg':'pos'}">${sg(s.gain)}</b></div><div><div class="mut">📅 Начато</div><b>${fd(S.start)}</b></div></div></div>
 ${who==='all'?`<div class="card"><div class="row" style="border:0;padding:0"><span>🎯 Цель ${money(S.goal)}</span><b>${pr.toFixed(1).replace('.',',')}%</b></div><div class="bar"><i style="width:${pr}%"></i></div></div>`:''}
 <div class="card"><div class="chips">${[[7,'Неделя'],[30,'Месяц'],[182,'6 месяцев'],[365,'Год'],[0,'Всё время']].map(r=>`<button class="${range===r[0]?'on':''}" data-a="range" data-v="${r[0]}">${r[1]}</button>`).join('')}</div>${chart()}</div>`},
bank(){const o=S.ops.filter(x=>x.t==='bank'&&vis(x)),s=(f)=>o.filter(f).reduce((a,x)=>a+base(x),0);
 const ini=s(x=>x.init),acc=s(x=>x.auto),inn=s(x=>!x.init&&!x.auto&&x.type==='in'),out=s(x=>x.type==='out'),tot=ini+inn+acc+out;
 const g={};o.forEach(x=>g[x.sub]=(g[x.sub]||0)+base(x));
 return`<div class="card"><div class="mut">Баланс банка${who==='all'?'':' · '+esc(pname(who))}</div><div class="big">${money(tot)}</div><p class="mut">Начальная сумма: ${money(ini)}<br>Пополнено: +${money(inn)}<br>💸 Доход с инвестиций: +${money(acc)}<br>Снято: −${money(Math.abs(out))}<br>Дата начала: ${fd(S.start)}</p></div>
 <div class="card"><h3>По банкам</h3>${Object.entries(g).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span><b>${money(v)}</b> ${owner()?`<button class="btn g sm" data-a="renbank" data-v="${esc(k)}">✏️</button>`:''}</span></div>`).join('')||'<div class="empty">Пока нет банков. Добавьте первое пополнение.</div>'}<div class="row"><b>Всего в банках</b><b>${money(tot)}</b></div></div>`},
invest(){const s=stats(),ids=who==='all'?S.people.map(p=>p.id):[who];
 const pc=id=>{const inv=pInv(id),val=pVal(id),g=val-inv,as={};S.ops.filter(o=>o.t==='inv'&&o.p===id).forEach(x=>as[x.sub]=(as[x.sub]||0)+base(x));
  return`<div class="card"><div class="row" style="border:0;padding:0"><h3>👤 ${esc(pname(id))}</h3>${canVal(id)?`<button class="btn g sm" data-a="invval" data-id="${id}">Обновить стоимость</button>`:''}</div>
  <div class="mid">${money(val)}</div>
  <p class="mut">💵 Вложено: ${money(inv)} · 📊 Изменение: <b class="${g<0?'neg':'pos'}">${sg(g)}</b>${S.accr&&S.rate>0&&val>0?`<br>💸 На банк каждый месяц: ~${money(val*S.rate/100)} (${S.rate}%)`:''}</p>
  ${Object.entries(as).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">Нет активов. Добавьте акции, ETF, облигации или другое.</div>'}</div>`};
 return(who==='all'?`<div class="card"><div class="mut">Все инвестиции вместе</div><div class="big">${money(s.iv)}</div><p class="mut">💵 Вложено: ${money(s.inv)} · 📊 <b class="${s.gain<0?'neg':'pos'}">${sg(s.gain)}</b><br>У каждого человека свой отдельный портфель — смотрите ниже или выберите человека сверху.</p></div>`:'')+ids.map(pc).join('')},
history(){const f={all:()=>1,bank:o=>o.t==='bank',inv:o=>o.t==='inv',in:o=>o.type==='in',out:o=>o.type==='out'}[hf];
 const l=S.ops.filter(o=>vis(o)&&f(o)).sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="chips">${[['all','Все'],['bank','Банк'],['inv','Инвестиции'],['in','Пополнения'],['out','Снятия']].map(x=>`<button class="${hf===x[0]?'on':''}" data-a="hf" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
 <div class="card">${l.map(o=>`<div class="row"><div><div>${fd(o.date)}</div><div class="mut">${o.init?'Начальная сумма':o.auto?'💸 '+esc(o.comment):esc(o.comment||(o.type==='in'?'Пополнение':'Снятие'))} · ${o.t==='bank'?'🏦':'📈'} ${esc(o.sub)} · ${esc(pname(o.p))}</div></div>
 <div style="text-align:right"><b class="${o.type==='out'?'neg':'pos'}">${o.type==='out'?'−':'+'}${money(o.amount,o.cur||'KZT')}</b><br>${canEdit(o)?`<button class="btn g sm" data-a="edit" data-id="${o.id}">Изменить</button>`:''}</div></div>`).join('')||'<div class="empty">Операций нет. Нажмите «+ Добавить».</div>'}</div>`},
people(){const tot=S.people.reduce((a,p)=>a+pCap(p.id),0),t1=tot||1;
 return`<div class="card"><h3>${esc(S.name)}</h3><div class="mut">Участников: ${S.people.length}</div>
 ${S.people.map(p=>`<div class="row"><div>👤 <b>${esc(p.name)}</b><div class="mut">${ROLE[p.role]} · доля ${(pCap(p.id)/t1*100).toFixed(0)}% · инвестиции ${money(pVal(p.id))}</div></div><span><b>${money(pCap(p.id))}</b> ${owner()?`<button class="btn g sm" data-a="person" data-id="${p.id}">✏️</button>`:''}</span></div>`).join('')}
 <div class="row"><b>Общий капитал</b><b>${money(tot)}</b></div>${owner()?'<button class="btn" data-a="person">+ Добавить человека</button>':''}</div>
 <div class="card mut"><b>Права:</b><br>👑 Владелец — всё: люди, суммы, история, настройки.<br>👤 Участник — добавляет и меняет свои деньги и стоимость своих инвестиций, смотрит всё.<br>👀 Наблюдатель — только просмотр.</div>`},
goals(){return S.goals.map(g=>{const p=Math.min(100,g.cur/g.target*100);return`<div class="card"><div class="row" style="border:0;padding:0"><h3>${esc(g.e)} ${esc(g.name)}</h3><button class="btn g sm" data-a="goal" data-id="${g.id}">✏️</button></div>
 <div class="mut">Сейчас ${money(g.cur)} из ${money(g.target)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="row" style="border:0;padding:0"><b>${p.toFixed(0)}%</b><span class="mut">Осталось ${money(Math.max(0,g.target-g.cur))}</span></div></div>`}).join('')+'<button class="btn" data-a="goal">+ Новая цель</button>'},
stats(){const s=stats(),ini=sum(o=>o.init),inn=sum(o=>!o.init&&!o.auto&&o.type==='in'),acc=sum(o=>o.auto),out=sum(o=>o.type==='out'),mo={};
 S.ops.filter(vis).forEach(o=>{const k=o.date.slice(0,7);mo[k]=mo[k]||[0,0];o.type==='in'?mo[k][0]+=base(o):mo[k][1]+=-base(o)});
 const ks=Object.keys(mo).sort().slice(-12),mx=Math.max(1,...ks.map(k=>Math.max(...mo[k]))),tot=S.people.reduce((a,p)=>a+pCap(p.id),0)||1;
 const sh=(n,v,t)=>`<div class="row"><span style="min-width:90px">${esc(n)}</span><div class="bar" style="flex:1"><i style="width:${Math.max(0,v/t*100)}%"></i></div><b>${(v/t*100).toFixed(0)}%</b></div>`;
 return`<div class="card"><h3>За всё время${who==='all'?'':' · '+esc(pname(who))}</h3><div class="row"><span>Начальная сумма</span><b>${money(ini)}</b></div><div class="row"><span>Всего внесено</span><b>${money(inn)}</b></div><div class="row"><span>💸 Доход с инвестиций на банк</span><b>${money(acc)}</b></div><div class="row"><span>Всего снято</span><b>${money(Math.abs(out))}</b></div><div class="row"><span>Текущий капитал</span><b>${money(s.cap)}</b></div></div>
 <div class="card"><h3>Пополнения и снятия по месяцам</h3><div class="bars">${ks.map(k=>`<div><span style="display:flex;gap:2px;align-items:flex-end;height:90px"><i style="flex:1;height:${mo[k][0]/mx*100}%"></i><i class="o" style="flex:1;height:${mo[k][1]/mx*100}%"></i></span>${k.slice(5)}.${k.slice(2,4)}</div>`).join('')||'<div class="empty">Нет данных</div>'}</div><p class="mut">Зелёный — пополнения, красный — снятия.</p></div>
 <div class="card"><h3>Банк и инвестиции</h3>${sh('🏦 Банк',s.bank,s.cap||1)}${sh('📈 Инвестиции',s.iv,s.cap||1)}</div>
 <div class="card"><h3>Доля участников</h3>${S.people.map(p=>sh(p.name,pCap(p.id),tot)).join('')}</div>`},
settings(){return`<div class="card"><div class="row"><span>Пользователь</span><b>${esc(S.user)} · ${ROLE[me().role]}</b></div><div class="row"><span>Валюта</span><b>${S.cur}</b></div><div class="row"><span>Доход с инвестиций на банк</span><b>${S.accr?S.rate+'% в месяц':'Выкл'}</b></div><div class="row"><span>Тема</span><b>${{auto:'Авто',light:'Светлая',dark:'Тёмная'}[S.theme]}</b></div><div class="row"><span>Уведомления</span><b>${S.notif?'Вкл':'Выкл'}</b></div><div class="row"><span>PIN</span><b>${S.pin?'Включён':'Нет'}</b></div>
 <div class="acts" style="flex-wrap:wrap"><button class="btn" data-a="settings">Изменить настройки</button><button class="btn g" data-a="backup">Экспорт / копия</button></div></div>
 <div class="card"><div class="mut">Суммы хранятся в исходной валюте операции, пересчёт идёт по приблизительным курсам: USD ${R.USD}, EUR ${R.EUR}, RUB ${R.RUB}, JPY ${R.JPY} ₸. Доход с инвестиций начисляется 1-го числа каждого месяца, когда приложение открыто (пропущенные месяцы досчитываются). Данные лежат в этом браузере.</div><div class="acts"><button class="btn g" data-a="reset">Демо-данные</button><button class="btn d" data-a="delacc">Удалить данные</button></div></div>`}
};
function chart(){
 const ops=S.ops.filter(vis).sort((a,b)=>a.date.localeCompare(b.date)),s=stats();
 let c=0,pts=ops.map(o=>[+new Date(o.date),c+=base(o)]);
 pts.push([Date.now(),s.cap]);
 const now=Date.now(),from=range?now-range*864e5:(pts[0]?pts[0][0]:now-864e5*30);
 let pre=0;pts.forEach(p=>{if(p[0]<from)pre=p[1]});
 let q=[[from,pre],...pts.filter(p=>p[0]>=from)];
 if(q.length<2)q=[[from,pre],[now,s.cap]];
 const x0=q[0][0],x1=q[q.length-1][0]||x0+1,ys=q.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),sp=(hi-lo)||1;
 const X=t=>20+(t-x0)/((x1-x0)||1)*560,Y=v=>150-(v-lo)/sp*120;
 const d=q.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
 return`<svg viewBox="0 0 600 180" role="img" aria-label="График капитала"><path d="${d}L${X(x1)} 165L20 165Z" fill="var(--acs)"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round"/><text x="20" y="14" fill="var(--mut)" font-size="12">${money(hi)}</text><text x="20" y="178" fill="var(--mut)" font-size="12">${money(lo)}</text></svg>`}
const TABS=[['home','🏠 Главная'],['bank','🏦 Банк'],['invest','📈 Инвестиции'],['history','📜 История'],['people','👥 Люди'],['goals','🎯 Цели'],['stats','📊 Аналитика'],['settings','⚙️ Настройки']];
function render(){
 document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;
 const app=document.getElementById('app');
 if(locked){app.innerHTML=`<div class="card" style="margin-top:20vh;text-align:center"><h2>InvestTrack</h2><p class="mut">Введите PIN-код</p><input id="pin" type="password" inputmode="numeric" style="text-align:center"><div class="acts"><button class="btn" id="go" style="flex:1">Открыть</button></div></div>`;
  document.getElementById('fab').innerHTML='';
  document.getElementById('go').onclick=()=>{if(document.getElementById('pin').value===S.pin){locked=false;render()}else alert('Неверный PIN')};return}
 const wb=S.people.length>1&&['home','bank','invest','history','stats'].includes(tab)?`<div class="chips who">${[['all','👥 Все вместе'],...S.people.map(p=>[p.id,'👤 '+p.name])].map(x=>`<button class="${who===x[0]?'on':''}" data-a="who" data-v="${esc(x[0])}">${esc(x[1])}</button>`).join('')}</div>`:'';
 app.innerHTML=`<div class="top"><div><b>InvestTrack</b><br><span>${esc(S.user)}</span></div></div><nav>${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>${wb}${V[tab]()}`;
 document.getElementById('fab').innerHTML=canAdd()&&['home','bank','invest','history'].includes(tab)?`<button class="btn" data-a="add" data-type="in" data-t="${tab==='invest'?'inv':'bank'}">+ Добавить</button><button class="btn g" style="background:var(--card);border:1px solid var(--line)" data-a="add" data-type="out" data-t="${tab==='invest'?'inv':'bank'}">− Снять</button>`:'';
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset)});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')A.close()});
migrate();accrue();render();
</script></body></html>
